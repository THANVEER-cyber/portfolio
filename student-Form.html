<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --surface: rgba(255, 255, 255, 0.85);
            --border: rgba(226, 232, 240, 0.8);
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(14, 165, 233, 0.15) 0px, transparent 50%);
            color: var(--text-main);
        }

        .main-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.2);
        }

        .header-group {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-group h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .header-group p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            font-size: 0.95rem;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        /* Hide number spin arrows for cleaner look */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-submit {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-reset {
            background-color: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid #e2e8f0;
        }

        .btn-reset:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        /* Result container styling */
        #output:empty {
            display: none;
        }

        #output {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        .output-header h3 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #059669;
        }

        .output-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.9rem;
        }

        .output-label {
            color: var(--text-muted);
        }

        .output-val {
            font-weight: 600;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="panel">
            <div class="header-group">
                <h1>Student Registration</h1>
                <p>Please enter your information below</p>
            </div>
            
            <form id="studentForm" novalidate>
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required />
                </div>
                
                <div class="input-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" min="10" max="99" placeholder="18" required />
                </div>
                
                <div class="input-group">
                    <label for="course">Course</label>
                    <input type="text" id="course" placeholder="Computer Science" required />
                </div>
                
                <div class="input-group">
                    <label for="number">Phone Number</label>
                    <input type="tel" id="number" placeholder="10-digit number" required />
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn-submit">Submit</button>
                    <button type="reset" class="btn-reset" id="resetBtn">Reset</button>
                </div>
            </form>
        </div>

        <div id="output"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("studentForm");
            const output = document.getElementById("output");
            const resetBtn = document.getElementById("resetBtn");

            // Helper to escape output and prevent script injection
            const escapeHtml = (text) => {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            };

            form.addEventListener("submit", (event) => {
                event.preventDefault();

                const name = document.getElementById("name").value.trim();
                const age = document.getElementById("age").value.trim();
                const course = document.getElementById("course").value.trim();
                const number = document.getElementById("number").value.trim();

                if (!name || !age || !course || !number) {
                    alert("Please fill in all fields before submitting.");
                    return;
                }

                output.innerHTML = `
                    <div class="output-header">
                        <h3>✓ Record Generated</h3>
                    </div>
                    <div class="output-row">
                        <span class="output-label">Full Name:</span>
                        <span class="output-val">${escapeHtml(name)}</span>
                    </div>
                    <div class="output-row">
                        <span class="output-label">Age:</span>
                        <span class="output-val">${escapeHtml(age)}</span>
                    </div>
                    <div class="output-row">
                        <span class="output-label">Course:</span>
                        <span class="output-val">${escapeHtml(course)}</span>
                    </div>
                    <div class="output-row">
                        <span class="output-label">Phone:</span>
                        <span class="output-val">${escapeHtml(number)}</span>
                    </div>
                `;

                form.reset();
            });

            resetBtn.addEventListener("click", () => {
                output.innerHTML = "";
            });
        });
    </script>
</body>
</html>
