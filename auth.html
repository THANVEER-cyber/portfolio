<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal & Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f9fafb;
      --text-sub: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.25) 0px, transparent 45%),
        radial-gradient(at 85% 85%, rgba(168, 85, 247, 0.2) 0px, transparent 45%);
      padding: 24px;
      color: var(--text-main);
    }

    .app-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    /* Auth Navigation */
    .tab-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 28px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    .header-area {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-area h2 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .header-area p {
      color: var(--text-sub);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    .input-field {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .input-field i.icon-prefix {
      color: var(--text-sub);
      padding-left: 16px;
    }

    .input-field input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      padding: 14px 14px 14px 12px;
      font-size: 0.92rem;
      color: var(--text-main);
    }

    .toggle-password {
      color: var(--text-sub);
      padding-right: 16px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .switch-prompt {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-top: 18px;
    }

    .switch-prompt a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    /* Dashboard Inner Styles */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .badge-active {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #4ade80;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-card">
    
    <!-- AUTHENTICATION VIEW -->
    <div id="authView">
      <div class="tab-switch">
        <button class="tab-btn active" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
        <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">Log In</button>
      </div>

      <!-- Sign Up Sub-form -->
      <form id="signupForm" onsubmit="handleRegister(event)">
        <div class="header-area">
          <h2>Create Account</h2>
          <p>Get started with your free profile</p>
        </div>

        <div class="input-field">
          <i class="fa-regular fa-user icon-prefix"></i>
          <input type="text" id="regUsername" placeholder="Username" required />
        </div>

        <div class="input-field">
          <i class="fa-regular fa-envelope icon-prefix"></i>
          <input type="email" id="regEmail" placeholder="Email Address" required />
        </div>

        <div class="input-field">
          <i class="fa-solid fa-lock icon-prefix"></i>
          <input type="password" id="regPassword" placeholder="Password" required />
          <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('regPassword', this)"></i>
        </div>

        <button type="submit" class="submit-btn">Sign Up</button>
        <p class="switch-prompt">Already have an account? <a onclick="switchTab('login')">Log In</a></p>
      </form>

      <!-- Login Sub-form -->
      <form id="loginForm" class="hidden" onsubmit="handleLogin(event)">
        <div class="header-area">
          <h2>Welcome Back</h2>
          <p>Enter your details to sign in</p>
        </div>

        <div class="input-field">
          <i class="fa-regular fa-envelope icon-prefix"></i>
          <input type="email" id="logEmail" placeholder="Email Address" required />
        </div>

        <div class="input-field">
          <i class="fa-solid fa-lock icon-prefix"></i>
          <input type="password" id="logPassword" placeholder="Password" required />
          <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('logPassword', this)"></i>
        </div>

        <button type="submit" class="submit-btn">Log In</button>
        <p class="switch-prompt">Need an account? <a onclick="switchTab('signup')">Sign Up</a></p>
      </form>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="hidden">
      <div class="top-bar">
        <div class="badge-active">
          <span class="status-dot"></span>
          Session Active
        </div>
        <button class="btn-logout" onclick="handleLogout()">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Log out
        </button>
      </div>

      <div class="profile-header">
        <div class="avatar" id="userAvatar">U</div>
        <div>
          <h2 id="userName" style="font-size: 1.25rem;">Welcome back!</h2>
          <p id="userEmail" style="font-size: 0.85rem; color: var(--text-sub);">user@example.com</p>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number">3</div>
          <div class="stat-label">PROJECTS</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">100%</div>
          <div class="stat-label">STORAGE</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">Active</div>
          <div class="stat-label">PLAN</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function switchTab(mode) {
      const isSignup = mode === 'signup';
      document.getElementById("signupForm").classList.toggle("hidden", !isSignup);
      document.getElementById("loginForm").classList.toggle("hidden", isSignup);
      document.getElementById("tabSignup").classList.toggle("active", isSignup);
      document.getElementById("tabLogin").classList.toggle("active", !isSignup);
    }

    function togglePasswordVisibility(inputId, icon) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";
      icon.classList.toggle("fa-eye", !isPassword);
      icon.classList.toggle("fa-eye-slash", isPassword);
    }

    function handleRegister(e) {
      e.preventDefault();
      const user = {
        username: document.getElementById("regUsername").value.trim(),
        email: document.getElementById("regEmail").value.trim(),
        password: document.getElementById("regPassword").value
      };

      localStorage.setItem("userAccount", JSON.stringify(user));
      alert("Registration complete! Please log in.");
      document.getElementById("signupForm").reset();
      switchTab('login');
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("logEmail").value.trim();
      const password = document.getElementById("logPassword").value;
      const stored = JSON.parse(localStorage.getItem("userAccount"));

      if (stored && stored.email === email && stored.password === password) {
        // Switch to Dashboard state
        document.getElementById("authView").classList.add("hidden");
        document.getElementById("dashboardView").classList.remove("hidden");

        document.getElementById("userName").textContent = `Welcome, ${stored.username}!`;
        document.getElementById("userEmail").textContent = stored.email;
        document.getElementById("userAvatar").textContent = stored.username.charAt(0).toUpperCase();
      } else {
        alert("Invalid email or password.");
      }
    }

    function handleLogout() {
      // Return to signup state
      document.getElementById("dashboardView").classList.add("hidden");
      document.getElementById("authView").classList.remove("hidden");
      switchTab('signup');
    }
  </script>
</body>
</html>
