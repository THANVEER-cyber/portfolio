<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(10, 15, 30, 0.85), rgba(10, 15, 30, 0.85)), url('background.avif') center/cover no-repeat;
            color: #00ffcc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 2.75rem;
            margin-bottom: 24px;
            text-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
        }
        button {
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
        }
    </style>
</head>
<body>
    <h1 id="greetings">Hello</h1>
    <button onclick="logout()">Logout</button>

    <script>
        const username = localStorage.getItem("username");
        if (username) {
            document.getElementById("greetings").textContent = `Welcome back, ${username}!`;
        } else {
            window.location.href = "login.html";
        }

        function logout() {
            localStorage.removeItem("username");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
